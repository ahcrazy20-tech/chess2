name: Build Android APK (ChessHelper v2.1.3, signed)

on:
  push:
    branches: [ main, 'arena/**' ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build signed release + debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # v3's default "tools" package is obsolete and breaks setup.
          packages: platform-tools platforms;android-35 build-tools;35.0.0

      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --list_installed
          test -d "$ANDROID_HOME/platforms/android-35"
          test -x "$ANDROID_HOME/build-tools/35.0.0/apksigner"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Bundle Stockfish 19 (arm64 + armv7)
        run: |
          set -euo pipefail
          mkdir -p /tmp/sf && cd /tmp/sf
          curl --retry 3 -fsSLo sf64.tar.gz https://github.com/official-stockfish/Stockfish/releases/download/sf_19/stockfish-android-arm64-universal.tar.gz
          curl --retry 3 -fsSLo sf32.tar.gz https://github.com/official-stockfish/Stockfish/releases/download/sf_19/stockfish-android-armv7-neon.tar.gz
          mkdir x64 x32
          tar -xzf sf64.tar.gz -C x64 || gunzip -c sf64.tar.gz > x64/stockfish
          tar -xzf sf32.tar.gz -C x32 || gunzip -c sf32.tar.gz > x32/stockfish
          BIN64=$(find x64 -type f -printf '%s %p\n' | sort -n | tail -1 | cut -d' ' -f2-)
          BIN32=$(find x32 -type f -printf '%s %p\n' | sort -n | tail -1 | cut -d' ' -f2-)
          echo "arm64: $BIN64 / armv7: $BIN32"
          JNILIBS="$GITHUB_WORKSPACE/android/app/src/main/jniLibs"
          mkdir -p "$JNILIBS/arm64-v8a" "$JNILIBS/armeabi-v7a"
          cp "$BIN64" "$JNILIBS/arm64-v8a/libstockfish.so"
          cp "$BIN32" "$JNILIBS/armeabi-v7a/libstockfish.so"
          chmod 644 "$JNILIBS"/arm64-v8a/libstockfish.so "$JNILIBS"/armeabi-v7a/libstockfish.so
          ls -lh "$JNILIBS"/*/*

      - name: Build release + debug APKs
        working-directory: android
        run: |
          set -o pipefail
          gradle --no-daemon assembleRelease assembleDebug --stacktrace 2>&1 | tee /tmp/gradle-build.log

      - name: Upload Gradle build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: /tmp/gradle-build.log
          if-no-files-found: warn
          retention-days: 7

      - name: Verify no invokedynamic call sites in dex
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/35.0.0"
          unzip -p android/app/build/outputs/apk/release/app-release.apk classes.dex > /tmp/classes.dex
          "$BT/dexdump" -f /tmp/classes.dex > /tmp/dexdump.txt
          if grep -qi 'call_site' /tmp/dexdump.txt; then
            echo "::error::invokedynamic call sites found in classes.dex"
            grep -i 'call_site' /tmp/dexdump.txt | head -n 10
            exit 1
          fi
          echo "No invokedynamic call sites found in classes.dex"

      - name: Verify signatures
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/35.0.0"
          "$BT/apksigner" verify --print-certs android/app/build/outputs/apk/release/app-release.apk
          "$BT/apksigner" verify --print-certs android/app/build/outputs/apk/debug/app-debug.apk

      - name: Collect APKs
        run: |
          set -euo pipefail
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/ChessHelper-v2.1.3-release.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/ChessHelper-v2.1.3-debug.apk
          ls -lh dist/

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: ChessHelper-v2.1.3-release-signed
          path: dist/ChessHelper-v2.1.3-release.apk
          if-no-files-found: error
          retention-days: 90

      - name: Upload signed debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ChessHelper-v2.1.3-debug-signed
          path: dist/ChessHelper-v2.1.3-debug.apk
          if-no-files-found: error
          retention-days: 90

      - name: Attach APKs to GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true

  diagnose-launch:
    name: Reproduce launch in emulator and capture logcat
    needs: build-apk
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download release APK
        uses: actions/download-artifact@v4
        with:
          name: ChessHelper-v2.1.3-release-signed
          path: /tmp/apk

      - name: Launch app in emulator and capture logcat
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          script: |
            set -e
            APK=$(find /tmp/apk -name '*.apk' | head -n 1)
            echo "Installing $APK"
            adb install -r "$APK"
            adb logcat -c
            adb shell monkey -p com.chesshelper.app -c android.intent.category.LAUNCHER 1
            sleep 25
            adb logcat -d > /tmp/logcat.txt || true
            echo "logcat lines: $(wc -l < /tmp/logcat.txt)"
            grep -i -A 40 'FATAL EXCEPTION' /tmp/logcat.txt | head -n 120 || true

      - name: Save logcat to branch
        if: always()
        run: |
          mkdir -p ci-debug
          cp /tmp/logcat.txt ci-debug/logcat.txt 2>/dev/null || echo "no logcat" > ci-debug/logcat.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f ci-debug/logcat.txt
          git commit -m "ci: emulator logcat [skip ci]" || true
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
