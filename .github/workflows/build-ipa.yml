name: Build Unsigned IPA (Stealth v2 + Embedded Stockfish)

on:
  push:
    branches: [ main ]
    tags:     [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ChessHelper with embedded Stockfish
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack manifest into project files
        run: |
          set -euo pipefail
          if [ ! -f chess-helper.manifest.json ]; then
            echo "❌ chess-helper.manifest.json not found"; exit 1
          fi
          python3 <<'PY'
          import json, base64, os
          m = json.load(open("chess-helper.manifest.json"))
          for f in m["files"]:
              path = f["path"]
              os.makedirs(os.path.dirname(path) or ".", exist_ok=True)
              with open(path, "wb") as fh:
                  fh.write(base64.b64decode(f["b64"]))
              print("  ✅", path)
          print(f"Unpacked {len(m['files'])} files")
          PY
          find Sources Resources -maxdepth 3 -print

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_16.app || sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Download & compile Stockfish 16 for iOS arm64
        run: |
          set -eo pipefail
          echo "==> Cloning Stockfish 16"
          git clone --depth 1 --branch sf_16 https://github.com/official-stockfish/Stockfish.git stockfish-src
          cd stockfish-src/src

          echo "==> Detecting iOS SDK"
          IOS_SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          CLANG=$(xcrun --sdk iphoneos --find clang++)
          echo "SDK: $IOS_SDK"
          echo "Compiler: $CLANG"

          echo "==> Patching Makefile for iOS static lib"
          # Build object files directly (no Makefile) — cleaner for iOS cross-compile
          SRCS="benchmark.cpp bitbase.cpp bitboard.cpp endgame.cpp evaluate.cpp material.cpp \
                misc.cpp movegen.cpp movepick.cpp pawns.cpp position.cpp psqt.cpp search.cpp \
                thread.cpp timeman.cpp tt.cpp uci.cpp ucioption.cpp tune.cpp tbprobe.cpp \
                nnue/evaluate_nnue.cpp nnue/features/half_ka_v2_hm.cpp"

          IOS_FLAGS="-arch arm64 -isysroot $IOS_SDK -miphoneos-version-min=16.0 \
                     -std=c++17 -O3 -DNDEBUG -DIS_64BIT -DUSE_POPCNT -DUSE_NEON=8 \
                     -DNNUE_EMBEDDING_OFF -fno-exceptions -fno-rtti -fPIC"

          echo "==> Compiling Stockfish sources"
          mkdir -p ../../StockfishBuild
          OBJS=""
          for src in $SRCS; do
            obj="../../StockfishBuild/$(echo $src | tr '/' '_').o"
            echo "  cc $src"
            $CLANG $IOS_FLAGS -I. -c $src -o $obj
            OBJS="$OBJS $obj"
          done

          echo "==> Archiving into libstockfish.a"
          xcrun --sdk iphoneos ar rcs ../../StockfishBuild/libstockfish.a $OBJS
          echo "==> Done"
          ls -lh ../../StockfishBuild/libstockfish.a

      - name: Move Stockfish lib into project
        run: |
          set -e
          mkdir -p Vendor/Stockfish/lib Vendor/Stockfish/include
          cp StockfishBuild/libstockfish.a Vendor/Stockfish/lib/
          # Copy the tiny UCI header we need
          cp stockfish-src/src/uci.h Vendor/Stockfish/include/
          cp stockfish-src/src/types.h Vendor/Stockfish/include/
          ls -R Vendor/Stockfish

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build ChessHelper.app (unsigned, arm64)
        run: |
          set -eo pipefail
          xcodebuild \
            -project ChessHelper.xcodeproj \
            -scheme ChessHelper \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            DEVELOPMENT_TEAM="" \
            ONLY_ACTIVE_ARCH=NO \
            ARCHS=arm64 \
            build

      - name: Package as unsigned .ipa
        run: |
          set -eo pipefail
          APP_PATH="$(find build/Build/Products -type d -name 'ChessHelper.app' | head -n 1)"
          echo "App bundle: $APP_PATH"
          [ -n "$APP_PATH" ] || { echo "ChessHelper.app not found"; exit 1; }
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qr ChessHelper-unsigned.ipa Payload
          ls -lh ChessHelper-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChessHelper-unsigned-ipa
          path: ChessHelper-unsigned.ipa
          if-no-files-found: error
          retention-days: 90

      - name: Attach IPA to Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ChessHelper-unsigned.ipa
          generate_release_notes: true
