android {
    namespace = "com.chesshelper.app"
    compileSdk = 35

    defaultConfig {
        applicationId = "com.chesshelper.app"
        minSdk = 24
        targetSdk = 35
        versionCode = 21
        versionName = "2.0.1"

        // Samsung Galaxy S26 Ultra is ARM64. Ship only arm64-v8a.
        ndk {
            abiFilters.add("arm64-v8a")
        }
    }

    // Test signing key committed at android/keystore/chesshelper-release.p12
    // (alias / password: chesshelper). Replace it with your own key before
    // publishing anywhere. See android/BUILD-ANDROID.md.
    signingConfigs {
        create("release") {
            storeFile = file("../keystore/chesshelper-release.p12")
            storeType = "PKCS12"
            storePassword = "chesshelper"
            keyAlias = "chesshelper"
            keyPassword = "chesshelper"
        }
    }

    buildTypes {
        release {
            isMinifyEnabled = false
            isShrinkResources = false
            proguardFiles(
                getDefaultProguardFile("proguard-android-optimize.txt"),
                "proguard-rules.pro"
            )
            signingConfig = signingConfigs.getByName("release")
        }
        debug {
            applicationIdSuffix = ".debug"
            versionNameSuffix = "-debug"
            isDebuggable = true
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    buildFeatures {
        viewBinding = true
    }

    // libstockfish.so is a *native executable* (Stockfish UCI) shipped through
    // jniLibs so Android extracts it to nativeLibraryDir where it can be exec'd.
    // Legacy packaging = extractNativeLibs=true is required for that to work.
    packaging {
        jniLibs.useLegacyPackaging = true
        resources.excludes += setOf("META-INF/*", "META-INF/services/*", "META-INF/DEPENDENCIES")
    }

    lint {
        abortOnError = false
        checkReleaseBuilds = false
    }
}

