// Top-level build file shared by all modules.
buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath "com.android.tools.build:gradle:8.7.3"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.25"
    }
}

// NOTE: dependency repositories are declared in settings.gradle
// (dependencyResolutionManagement with FAIL_ON_PROJECT_REPOS) — do NOT add
// an allprojects { repositories { ... } } block here, it breaks that mode.

tasks.register('clean', Delete) {
    delete rootProject.layout.buildDirectory
}
