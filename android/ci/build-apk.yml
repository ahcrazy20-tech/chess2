name: Build Android APK (S26 Ultra Optimized) — Signed

on:
  push:
    branches: [ main, arena/* ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build ChessHelper APK (arm64, S26 Ultra) — both flavors, signed
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10"

      - name: Make gradlew executable
        run: chmod +x android/gradlew || true

      # The release.keystore is committed at android/release.keystore (PKCS12, pass: chesshelper)
      # For your own Play Store release, replace it with your private keystore and update storePassword in app/build.gradle.kts
      - name: Verify signing keystore
        run: |
          ls -lh android/release.keystore
          openssl pkcs12 -info -in android/release.keystore -passin pass:chesshelper -nokeys 2>&1 | head -n 20 || true

      # ——— Optional: bundle real Stockfish 16 for S26 Ultra (uncomment to enable) ———
      # By default CI ships MOCK engine (no NDK needed, UI fully works).
      # For ~3400 Elo, uncomment below. Takes ~4 min, needs 12 GB RAM runner.
      # - name: Build Stockfish 16 for Android arm64 (S26 Ultra)
      #   run: |
      #     set -e
      #     sudo apt-get update && sudo apt-get install -y make g++ clang
      #     git clone --depth 1 --branch sf_16 https://github.com/official-stockfish/Stockfish.git /tmp/stockfish
      #     cd /tmp/stockfish/src
      #     $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;27.0.12077973"
      #     export NDK=$ANDROID_HOME/ndk/27.0.12077973
      #     export TOOLCHAIN=$NDK/toolchains/llvm/prebuilt/linux-x86_64
      #     export CC=$TOOLCHAIN/bin/aarch64-linux-android33-clang++
      #     make -j$(nproc) build ARCH=armv8 COMP=ndk COMPCC="$CC" ndk TARGET=arm64-v8a
      #     mkdir -p $GITHUB_WORKSPACE/android/app/src/main/jniLibs/arm64-v8a
      #     cp stockfish $GITHUB_WORKSPACE/android/app/src/main/jniLibs/arm64-v8a/libstockfish.so || cp libstockfish.so $GITHUB_WORKSPACE/android/app/src/main/jniLibs/arm64-v8a/ || true
      #     ls -lh $GITHUB_WORKSPACE/android/app/src/main/jniLibs/arm64-v8a/

      - name: Build Debug (both flavors — helper + chess exact clone, mock engine)
        working-directory: android
        run: gradle assembleDebug --stacktrace

      - name: Build Release (SIGNED — both flavors, via android/release.keystore)
        working-directory: android
        run: gradle assembleRelease --stacktrace

      - name: List APKs
        run: |
          echo "=== APKs ==="
          find android/app/build/outputs -name "*.apk" -type f | xargs ls -lh 2>&1 || true
          echo "=== AABs ==="
          find android/app/build/outputs -name "*.aab" -type f | xargs ls -lh 2>&1 || true
          echo "=== Flavors ==="
          ls -R android/app/build/outputs/apk 2>&1 | head -n 100

      - name: Upload — Helper Debug
        uses: actions/upload-artifact@v4
        with:
          name: ChessHelper-helper-debug-s26ultra-signed
          path: android/app/build/outputs/apk/helper/debug/*.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Upload — Chess Exact Clone Debug (looks like official Chess.com)
        uses: actions/upload-artifact@v4
        with:
          name: Chess-chess-debug-s26ultra-signed-exact-clone
          path: android/app/build/outputs/apk/chess/debug/*.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Upload — Helper Release (SIGNED)
        uses: actions/upload-artifact@v4
        with:
          name: ChessHelper-helper-release-s26ultra-SIGNED
          path: android/app/build/outputs/apk/helper/release/*.apk
          if-no-files-found: warn
          retention-days: 90

      - name: Upload — Chess Exact Clone Release (SIGNED — same icon/name as Chess.com)
        uses: actions/upload-artifact@v4
        with:
          name: Chess-chess-release-s26ultra-SIGNED-EXACT-CLONE
          path: android/app/build/outputs/apk/chess/release/*.apk
          if-no-files-found: warn
          retention-days: 90

      - name: Attach APKs to Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            android/app/build/outputs/apk/helper/release/*.apk
            android/app/build/outputs/apk/chess/release/*.apk
            android/app/build/outputs/apk/helper/debug/*.apk
            android/app/build/outputs/apk/chess/debug/*.apk
          generate_release_notes: true
