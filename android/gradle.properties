# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# AndroidX is required by the appcompat / activity / lifecycle dependencies.
android.useAndroidX=true

# The only packaged native artifact is Stockfish (already built for arm64).
android.defaults.buildfeatures.buildconfig=false
android.nonTransitiveRClass=true
