# NOTE: this workflow lives outside .github/workflows/ in this repo because the
# GitHub App used to push may lack the `workflows` scope. To activate CI, copy
# this file to .github/workflows/build-apk.yml (contents are ready to run).
name: Build Android APK (signed)

on:
  push:
    branches: [ main, 'arena/**' ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build ChessHelper APK (signed release + debug)
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Ensure Gradle is available
        run: |
          if ! command -v gradle >/dev/null 2>&1; then
            curl -sSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.9-bin.zip
            sudo unzip -q /tmp/gradle.zip -d /opt
            echo "/opt/gradle-8.9/bin" >> "$GITHUB_PATH"
          fi
          gradle --version

      # Bundle the real Stockfish 19 engine for Android (official GitHub release
      # binaries). It is packed as a JNI lib (libstockfish.so) so Android extracts
      # it with exec permission — the app runs it as a UCI subprocess.
      # If anything here fails, the app still works with its built-in engine.
      - name: Bundle Stockfish 19 (arm64 + armv7)
        run: |
          set -e
          mkdir -p /tmp/sf && cd /tmp/sf
          curl -sSL -o sf64.tar.gz https://github.com/official-stockfish/Stockfish/releases/download/sf_19/stockfish-android-arm64-universal.tar.gz
          curl -sSL -o sf32.tar.gz https://github.com/official-stockfish/Stockfish/releases/download/sf_19/stockfish-android-armv7-neon.tar.gz
          mkdir x64 x32
          tar -xzf sf64.tar.gz -C x64 || gunzip -c sf64.tar.gz > x64/stockfish
          tar -xzf sf32.tar.gz -C x32 || gunzip -c sf32.tar.gz > x32/stockfish
          # The binary is the largest file in each extracted tree.
          BIN64=$(find x64 -type f -printf '%s %p\n' | sort -n | tail -1 | cut -d' ' -f2-)
          BIN32=$(find x32 -type f -printf '%s %p\n' | sort -n | tail -1 | cut -d' ' -f2-)
          echo "arm64 binary: $BIN64"; file "$BIN64" || true
          echo "armv7 binary: $BIN32"; file "$BIN32" || true
          JNILIBS="$GITHUB_WORKSPACE/android/app/src/main/jniLibs"
          mkdir -p "$JNILIBS/arm64-v8a" "$JNILIBS/armeabi-v7a"
          cp "$BIN64" "$JNILIBS/arm64-v8a/libstockfish.so"
          cp "$BIN32" "$JNILIBS/armeabi-v7a/libstockfish.so"
          chmod 644 "$JNILIBS/arm64-v8a/libstockfish.so" "$JNILIBS/armeabi-v7a/libstockfish.so"
          ls -lh "$JNILIBS"/*

      - name: Build Release + Debug APK (signed)
        working-directory: android
        run: gradle assembleRelease assembleDebug --stacktrace

      - name: Verify signatures
        run: |
          BT="$ANDROID_HOME/build-tools/35.0.0"
          "$BT/apksigner" verify --print-certs android/app/build/outputs/apk/release/app-release.apk
          "$BT/apksigner" verify --print-certs android/app/build/outputs/apk/debug/app-debug.apk

      - name: Collect APKs
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/ChessHelper-v2.1.0-release.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/ChessHelper-v2.1.0-debug.apk
          ls -lh dist/

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: ChessHelper-APKs-signed
          path: dist/*.apk
          retention-days: 90

      - name: Attach APKs to Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.apk
          generate_release_notes: true
